name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "release/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra accelerate --extra numba

      - name: Run tests
        run: uv run pytest tests/

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build sdist and wheel
        run: uv build --sdist --wheel

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  wheel-smoke:
    name: Install-from-wheel smoke test
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build sdist and wheel
        run: uv build --sdist --wheel

      - name: Install wheel in a fresh virtualenv
        run: |
          "$(uv python find 3.11)" -m venv .smoke
          . .smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          origami --version
          python - <<'PY'
          import importlib.metadata as metadata

          import origami
          from origami import OrigamiPipeline

          assert origami.__version__ == metadata.version("origami-ml")
          assert OrigamiPipeline is not None
          print(f"origami-ml {origami.__version__} import smoke ok")
          PY
